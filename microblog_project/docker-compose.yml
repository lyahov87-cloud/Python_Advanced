version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: microblog_db
    restart: always
    environment:
      POSTGRES_USER: microuser
      POSTGRES_PASSWORD: micropassword
      POSTGRES_DB: microblog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    # Исправление: Docker будет проверять, готов ли Postgres отвечать на запросы
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microuser -d microblog"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: microblog_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql+psycopg2://microuser:micropassword@db:5432/microblog
    ports:
      - "8000:8000"
    # Исправление: бэкенд запустится СТРОГО после того, как healthcheck базы станет "healthy"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - media_uploads:/app/media

  frontend:
    image: nginx:alpine
    container_name: microblog_frontend
    ports:
      - "80:80"
    volumes:
      - ./static:/usr/share/nginx/html
      - ./static/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  media_uploads:

